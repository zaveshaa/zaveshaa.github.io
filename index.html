<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zaveshaa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { width: 100%; height: 100%; }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            line-height: 1.6;
            color: #000;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes shimmer1 {
            0% { background-position: 0 0; }
            100% { background-position: 128px 128px; }
        }
        @keyframes shimmer2 {
            0% { background-position: 0 0; }
            100% { background-position: -80px 96px; }
        }
        @keyframes shimmer3 {
            0% { background-position: 0 0; }
            100% { background-position: 64px -48px; }
        }

        .noise {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .noise::before, .noise::after {
            content: '';
            position: absolute;
            inset: 0;
            background-repeat: repeat;
        }

        .noise::before {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 96px 96px;
            animation: shimmer1 3s linear infinite;
            opacity: 0.35;
        }

        .noise::after {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 64px 64px;
            animation: shimmer2 2.4s linear infinite;
            opacity: 0.2;
        }

        .noise-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: #f2f2ee;
        }

        .noise-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.35' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: shimmer3 6s linear infinite;
            opacity: 0.15;
        }

        #main {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            flex-direction: column;
        }

        .name {
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .sub {
            font-size: 0.9rem;
            color: #333;
            margin-top: 4px;
        }

        .divider {
            margin: 28px auto;
            width: 40px;
            height: 1px;
            background: #bbb;
        }

        .bio {
            max-width: 440px;
            font-size: 0.92rem;
            color: #111;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 20px;
            font-size: 0.95rem;
        }

        .links a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .links a:hover { border-bottom-color: #111; }

        .links .sep { color: #bbb; user-select: none; }

        @media (max-width: 480px) {
            .name { font-size: 1.8rem; }
            .links { font-size: 0.85rem; gap: 6px 14px; }
        }
    </style>
</head>
<body>

<div class="noise-bg"></div>
<div class="noise" id="noise"></div>

<div id="main">
    <div class="name">zaveshaa</div>
    <div class="sub">dmitry aleksandrov</div>

    <div class="divider"></div>

    <div class="bio">
        Per aspera. Nunquam cedendum.
    </div>

    <div class="links">
        <a href="https://t.me/DUDOSONDOSARA"><s>telegram</s></a>
        <span class="sep">//</span>
        <a href="https://github.com/zaveshaa">github</a>
        <span class="sep">//</span>
        <a href="https://youtube.com/@zaveshaa">youtube</a>
        <span class="sep">//</span>
        <a href="#" id="email-link">email</a>
        <span class="sep">//</span>
        <a href="portfolio.html">portfolio</a>
        <span class="sep">//</span>
        <!-- in progress <3 -->
        <a href="blog.html">blog</a>
    </div>
</div>

<div class="toast" id="toast"></div>

<style>
    .toast {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        background: #111;
        color: #fafaf9;
        padding: 8px 20px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.82rem;
        opacity: 0;
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
        z-index: 2;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<script>
    document.getElementById('email-link').addEventListener('click', (e) => {
        e.preventDefault();
        navigator.clipboard.writeText('i@zaveshaadev.ru');
        const toast = document.getElementById('toast');
        toast.textContent = 'copied: i@zaveshaadev.ru';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
    });


</script>

</body>
</html>
