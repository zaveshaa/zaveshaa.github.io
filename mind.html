<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zaveshaa — mind</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            line-height: 1.6;
            color: #000;
            background: #f2f2ee;
            -webkit-font-smoothing: antialiased;
        }

        @keyframes shimmer1 { 0% { background-position: 0 0; } 100% { background-position: 128px 128px; } }
        @keyframes shimmer2 { 0% { background-position: 0 0; } 100% { background-position: -80px 96px; } }
        @keyframes shimmer3 { 0% { background-position: 0 0; } 100% { background-position: 64px -48px; } }

        .noise { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .noise::before, .noise::after { content: ''; position: absolute; inset: 0; background-repeat: repeat; }
        .noise::before {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 96px 96px; animation: shimmer1 3s linear infinite; opacity: 0.35;
        }
        .noise::after {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 64px 64px; animation: shimmer2 2.4s linear infinite; opacity: 0.2;
        }
        .noise-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: #f2f2ee; }
        .noise-bg::before {
            content: ''; position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.35' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat; background-size: 200px 200px; animation: shimmer3 6s linear infinite; opacity: 0.15;
        }

        .back {
            position: fixed; top: 28px; left: 32px; z-index: 3;
            font-size: 1.6rem; letter-spacing: 1px;
            color: #000; text-decoration: none;
            border-bottom: 1px solid transparent; transition: border-color 0.2s;
        }
        .back:hover { border-bottom-color: #111; }

        #main {
            position: relative; z-index: 1;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center;
            padding: 100px 48px 80px;
        }

        .label {
            font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase;
            color: #999; margin-bottom: 30px;
        }

        .snake {
            max-width: 900px;
            font-size: clamp(1.5rem, 4vw, 2.7rem);
            line-height: 1.5;
            font-weight: 400;
            letter-spacing: 0.5px;
            animation: float 7s ease-in-out infinite;
        }

        .snake .word { display: inline-block; white-space: nowrap; }
        .snake .word span {
            display: inline-block;
            animation: slither 3.2s ease-in-out infinite;
            animation-delay: calc(var(--i) * -0.09s);
        }

        @keyframes slither {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-0.22em) rotate(-2deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(0.22em) rotate(2deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .note {
            max-width: 420px;
            margin-top: 34px;
            font-size: 0.92rem;
            line-height: 1.7;
            color: #555;
        }

        @media (max-width: 640px) {
            #main { padding: 90px 28px 70px; }
            .back { left: 20px; top: 20px; font-size: 1.35rem; }
        }
    </style>
</head>
<body>

<div class="noise-bg"></div>
<div class="noise"></div>

<a href="index.html" class="back">zaveshaa</a>

<div id="main">
    <div class="label">mind</div>

    <h1 class="snake" aria-label="the mind moves in curves, never in straight lines">the mind moves in curves, never in straight lines</h1>

    <p class="note">A room for fragments, questions, and thoughts that are still becoming.</p>
</div>

<script>
    const snake = document.querySelector('.snake');
    const text = snake.textContent.trim();
    snake.textContent = '';

    let index = 0;
    text.split(' ').forEach((word, wordIndex, words) => {
        const wordEl = document.createElement('span');
        wordEl.className = 'word';

        for (const char of word) {
            const charEl = document.createElement('span');
            charEl.textContent = char;
            charEl.style.setProperty('--i', index++);
            wordEl.appendChild(charEl);
        }

        snake.appendChild(wordEl);
        if (wordIndex < words.length - 1) snake.appendChild(document.createTextNode(' '));
    });
</script>

</body>
</html>
